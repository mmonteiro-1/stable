<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar" content="white">
	<meta name="theme-color" content="#FFFFFF">
	<link rel="apple-touch-icon" href="images/favicon/apple-touch-icon.png">
	<link rel="manifest" href="js/manifest.json">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;700;800&family=League+Spartan:wght@400;600;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="css/style.css?v=2" />
	<link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico">
	<title>Stable</title>
</head>
<body>
	<style type="text/css">
		.feature_description {
			position: absolute;
			bottom: 5%;
		}
	</style>
	<nav></nav>
	<div class="content_email_sent">
		<div class="dictionary">
			<div class="title">Thank you for getting in touch.</div>
			<div class="definition">We'll get back to you as soon as possible.</div>
			<div class="feature_description">You'll be redirected to the home page in <span id="countdown">5</span> seconds.</div>
		</div>
	</div>
	<script type="text/javascript">
		fetch("nav.html").then(r=>r.text()).then(h=>{document.querySelector("nav").innerHTML=h});
		window.onload = function() {
			setTimeout(function() {
				window.location.href = "https://stablearchviz.com";
			}, 7000);
		};
		function startCountdown() {
			var count = 5;
			var el = document.getElementById('countdown');
			var timer = setInterval(function() {
				el.textContent = count;
				count--;
				if (count < 0) {
					clearInterval(timer);
					el.textContent = '0';
				}
			}, 1000);
		}
		document.addEventListener('DOMContentLoaded', startCountdown);
	</script>
</body>
</html>

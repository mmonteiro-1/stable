				<div class="row">

				</div>
				<div class="row">
					<div class="image">
						<img loading="lazy" alt="3d render of a house" src="images/planoalto_09.webp">

					<div class="image">
						<img loading="lazy" alt="3d render of a house" src="images/planoalto_06.webp">

				<footer></footer>

		</div>
	</div>
	<div id="video-overlay" style="display: none;">
		<div id="video-container"></div>
		<div id="video-close"></div>
	</div>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
	<script type="text/javascript" src="js/navigation.js?v=2"></script>
	<script src="js/imageviewer.js?v=2"></script>
	<script type="text/javascript">
		fetch("nav.html").then(r=>r.text()).then(h=>{document.querySelector("nav").innerHTML=h});
		fetch("footer.html").then(r=>r.text()).then(h=>{document.querySelector("footer").innerHTML=h});
		imageviewer();

		// Create Iframes
		function createIframes() {
			var videoContainer = document.getElementById("video-container");

			// Create Office Iframe
			var officeIframe = document.createElement("iframe");
			officeIframe.id = "walkthrough-video";
			officeIframe.width = "100%";
			officeIframe.height = "100%";
			officeIframe.src = "https://www.youtube.com/embed/GOxOQFDSvAU?si=b64xhhxTr_Zsjx6_&rel=0";
			officeIframe.title = "YouTube video player";
			officeIframe.frameBorder = "0";
			officeIframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
			officeIframe.referrerPolicy = "strict-origin-when-cross-origin";
			officeIframe.allowFullscreen = true;
			officeIframe.style.display = "none";
			videoContainer.appendChild(officeIframe);

			// Create Cinematic Iframe
			var cinematicIframe = document.createElement("iframe");
			cinematicIframe.id = "cinematic-video";
			cinematicIframe.width = "100%";
			cinematicIframe.height = "100%";
			cinematicIframe.src = "https://www.youtube.com/embed/H3fiQQPz9Tg?si=i1x70bpIw_q5xSRp&rel=0";
			cinematicIframe.title = "YouTube video player";
			cinematicIframe.frameBorder = "0";
			cinematicIframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
			cinematicIframe.referrerPolicy = "strict-origin-when-cross-origin";
			cinematicIframe.allowFullscreen = true;
			cinematicIframe.style.display = "none";
			videoContainer.appendChild(cinematicIframe);
		}

		// Load the iframes after the page has loaded
		if (window.addEventListener) {
			window.addEventListener("load", createIframes, false);
		} else if (window.attachEvent) {
			window.attachEvent("onload", createIframes);
		} else {
			window.onload = createIframes;
		}

		document.addEventListener('DOMContentLoaded', () => {
			document.querySelectorAll('[id^="watch-"]').forEach(btn => {
				btn.addEventListener('click', () => {
					const videoType = btn.id.split('-')[1];
					document.getElementById('video-overlay').style.display = '';
					document.querySelectorAll('#video-container iframe').forEach(iframe => {
						iframe.style.display = iframe.id === videoType + '-video' ? '' : 'none';
					});
					document.body.classList.add('no-scroll');
					document.querySelector('nav').style.display = 'none';
				});
			});
			document.getElementById('video-close').addEventListener('click', () => {
				document.getElementById('video-overlay').style.display = 'none';
				document.querySelectorAll('#video-container iframe').forEach(iframe => { iframe.src = iframe.src; });
				document.body.classList.remove('no-scroll');
				document.querySelector('nav').style.display = '';
			});
		});
	</script>
</body>
</html>
